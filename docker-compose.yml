# -------------------------------------------------------
# .env file required with the following variables:
#   POSTGRES_PASSWORD=your_password
#   NEO4J_PASSWORD=your_password
# -------------------------------------------------------

services:

  # ── KAFKA (KRaft mode) ────────────────────────────────
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    networks:
      - linkedin-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── KAFKA UI ──────────────────────────────────────────
  kafbat-ui:
    container_name: kafbat-ui
    image: kafbat/kafka-ui:v1.4.2
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - linkedin-network
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Removed dangling ksqlDB reference — no ksqlDB service defined
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── POSTGRES — NOTIFICATIONS ──────────────────────────
  notification-db:
    image: postgres:16
    container_name: notifications-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=notificationsdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - linkedin-network
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── POSTGRES — POSTS ──────────────────────────────────
  posts-db:
    image: postgres:16
    container_name: posts-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postsdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - linkedin-network
    volumes:
      - posts-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── POSTGRES — USERS ──────────────────────────────────
  user-db:
    image: postgres:16
    container_name: users-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=usersdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - linkedin-network
    volumes:
      - user-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── NEO4J — CONNECTIONS ───────────────────────────────
  connections-db:
    image: neo4j:5.20
    container_name: connections-db
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - connections-db-data:/data
    networks:
      - linkedin-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── DISCOVERY SERVER (Eureka) ─────────────────────────
  discovery-server:
    image: abdurrahman2015/linkedin-app-discovery-server
    container_name: discovery-server
    restart: unless-stopped
    networks:
      - linkedin-network
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── CONFIG SERVER ─────────────────────────────────────
  config-server:
    image: abdurrahman2015/linkedin-app-config-server
    container_name: config-server
    restart: unless-stopped
    networks:
      - linkedin-network
    depends_on:
      discovery-server:
        condition: service_healthy
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── POSTS SERVICE ─────────────────────────────────────
  posts-service:
    image: abdurrahman2015/linkedin-app-posts-service
    container_name: posts-service
    restart: unless-stopped
    networks:
      - linkedin-network
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      posts-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── USER SERVICE ──────────────────────────────────────
  user-service:
    image: abdurrahman2015/linkedin-app-user-service
    container_name: user-service
    restart: unless-stopped
    networks:
      - linkedin-network
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── NOTIFICATION SERVICE ──────────────────────────────
  notification-service:
    image: abdurrahman2015/linkedin-app-notifications-service
    container_name: notifications-service
    restart: unless-stopped
    networks:
      - linkedin-network
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── CONNECTIONS SERVICE ───────────────────────────────
  connections-service:
    image: abdurrahman2015/linkedin-app-connections-service
    container_name: connections-service
    restart: unless-stopped
    networks:
      - linkedin-network
    depends_on:
      discovery-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      connections-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── API GATEWAY ───────────────────────────────────────
  api-gateway:
    image: abdurrahman2015/linkedin-app-api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      - linkedin-network
    depends_on:
      discovery-server:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── NETWORKS ───────────────────────────────────────────
networks:
  linkedin-network:

# ── VOLUMES ────────────────────────────────────────────
volumes:
  kafka_data:
  notification-db-data:
  posts-db-data:
  user-db-data:
  connections-db-data: